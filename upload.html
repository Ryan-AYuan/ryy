<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Files - Ryy's Space</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@300;400;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff99ac;
            --secondary-color: #b39ddb;
            --dark-bg: #fff0f5;
            --card-bg: #ffffff;
            --text-color: #ff6b81;
            --light-text: #666666;
        }

        body {
            font-family: 'Noto Serif TC', 'Noto Sans TC', serif;
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: var(--light-text);
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #fff0f5 0%, #ffe6eb 100%);
            padding: 2rem 0;
            text-align: center;
            box-shadow: 0 4px 15px rgba(255, 153, 172, 0.15);
        }

        h1 {
            margin: 0;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 2.5rem;
            color: var(--primary-color);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .upload-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--secondary-color);
            font-weight: bold;
        }

        input[type="text"],
        input[type="password"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #eee;
            border-radius: 8px;
            font-size: 16px; /* keep 16px to avoid iOS zoom */
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        /* Flexbox for date inputs */
        .date-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .date-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            outline: none;
        }

        .file-drop-zone {
            position: relative;
            border: 2px dashed var(--secondary-color);
            padding: 2rem 1rem;
            min-height: 120px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0.4rem;
            overflow: hidden;
        }

        .file-drop-zone:hover,
        .file-drop-zone:active {
            background-color: #f9f9f9;
        }

        .file-drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
            font-size: 100px; /* iOS: larger hit target for the native control */
        }

        .file-drop-hint {
            pointer-events: none;
            font-size: 1rem;
            color: var(--secondary-color);
        }

        .file-drop-sub {
            pointer-events: none;
            font-size: 0.85rem;
            color: #999;
        }

        @media (max-width: 640px) {
            header { padding: 1.25rem 0; }
            h1 { font-size: 1.8rem; }
            main { margin: 1rem auto; }
            .upload-card { padding: 1.25rem; }
            .btn { min-height: 48px; }
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            font-family: 'Ma Shan Zheng', cursive;
            transition: transform 0.2s, background 0.2s;
        }

        .btn:hover {
            background: #ff7e96;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            margin-top: 1rem;
            padding: 1rem;
            border-radius: 8px;
            display: none;
        }

        .status.success {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }

        .status.error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }
        
        .config-section {
            border-bottom: 1px solid #eee;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }
        
        .toggle-config {
            font-size: 0.9rem;
            color: var(--secondary-color);
            cursor: pointer;
            text-decoration: underline;
            margin-bottom: 1rem;
            display: inline-block;
        }
        
        .hidden {
            display: none;
        }

        .token-hint {
            font-size: 0.85rem;
            color: #2e7d32;
            background: #e8f5e9;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            margin: 0 0 1rem 0;
            line-height: 1.5;
        }

        .token-hint.warn {
            color: #9a3412;
            background: #ffedd5;
        }

        .token-hint.error {
            color: #991b1b;
            background: #fee2e2;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: var(--primary-color);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header>
        <h1>Upload to Cloud</h1>
    </header>

    <main>
        <a href="https://ryan-ayuan.github.io/ryy/" class="back-link">← Back to Home</a>
        
        <div class="upload-card">
            <div class="toggle-config" onclick="toggleConfig()">⚙️ Configure GitHub Settings</div>
            <p id="tokenSavedHint" class="token-hint hidden">此裝置已記住家庭碼，可直接上傳。</p>
            <p id="tokenExpiredHint" class="token-hint error hidden">憑證過期，請聯繫管理員。</p>
            
            <div id="configSection" class="config-section hidden">
                <div class="form-group">
                    <label>家庭碼或 GitHub Token</label>
                    <input type="password" id="ghToken" placeholder="例如 9777 / 2347">
                </div>
                <div class="form-group">
                    <label>Owner (Username)</label>
                    <input type="text" id="ghOwner" value="Ryan-AYuan">
                </div>
                <div class="form-group">
                    <label>Repository Name</label>
                    <input type="text" id="ghRepo" value="ryy">
                </div>
                <div class="form-group">
                    <label>Branch</label>
                    <input type="text" id="ghBranch" value="main">
                </div>
                <button class="btn" onclick="saveConfig()" style="width: auto; padding: 8px 20px; font-size: 1rem;">Save Settings</button>
            </div>

            <div class="form-group">
                <label>Target Folder</label>
                <select id="targetFolder" onchange="toggleAlbumInputs()">
                    <option value="bgm">BGM (Music)</option>
                    <option value="code">Code</option>
                    <option value="photo">Photo</option>
                </select>
            </div>

            <div id="albumInputs" class="hidden">
                <div class="form-group">
                    <label>Album</label>
                    <select id="uploadAlbum">
                        <option value="moments_of_love">Moments of Love</option>
                        <option value="forever&amp;3k">Forever &amp; 3k</option>
                    </select>
                </div>
            </div>

            <label class="file-drop-zone" for="fileInput">
                <span class="file-drop-hint" id="dropHint">點擊選擇照片</span>
                <span class="file-drop-sub" id="dropSub">手機可從相簿選取或拍照；電腦可拖放檔案</span>
                <input type="file" id="fileInput" multiple accept="image/*" onchange="updateFileList()">
            </label>
            <div id="fileList" style="margin-bottom: 1rem; font-size: 0.9rem;"></div>

            <button class="btn" id="uploadBtn" onclick="uploadFiles()">Start Upload</button>
            
            <div id="statusArea" class="status"></div>
        </div>
    </main>

    <script src="upload-auth.js"></script>
    <script>
        const TOKEN_EXPIRED_MSG = '憑證過期，請聯繫管理員';

        function b64ToBytes(b64) {
            const bin = atob(b64);
            const out = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
        }

        async function decryptAlias(pin, pack) {
            const salt = b64ToBytes(pack.salt);
            const iv = b64ToBytes(pack.iv);
            const data = b64ToBytes(pack.data);
            const material = await crypto.subtle.importKey(
                'raw',
                new TextEncoder().encode(pin),
                'PBKDF2',
                false,
                ['deriveKey']
            );
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
                material,
                { name: 'AES-GCM', length: 256 },
                false,
                ['decrypt']
            );
            const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, data);
            return new TextDecoder().decode(plain);
        }

        async function resolveGitHubToken(input) {
            const value = (input || '').trim();
            if (!value) throw new Error('請填寫家庭碼或 Token');
            if (/^(ghp_|github_pat_)/.test(value)) return value;
            const vault = (window.UPLOAD_AUTH && window.UPLOAD_AUTH.vault) || {};
            const pack = vault[value];
            if (!pack) throw new Error('家庭碼不正確');
            try {
                return await decryptAlias(value, pack);
            } catch (e) {
                throw new Error('家庭碼不正確');
            }
        }

        function showExpiredHint(show) {
            const hint = document.getElementById('tokenExpiredHint');
            if (!hint) return;
            if (show) hint.classList.remove('hidden');
            else hint.classList.add('hidden');
        }

        async function assertTokenUsable(token) {
            const resp = await fetch('https://api.github.com/rate_limit', {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Accept': 'application/vnd.github+json'
                }
            });
            if (resp.status === 401 || resp.status === 403) {
                throw new Error(TOKEN_EXPIRED_MSG);
            }
            if (!resp.ok) {
                throw new Error(`無法驗證憑證（HTTP ${resp.status}）`);
            }
            const header = resp.headers.get('GitHub-Authentication-Token-Expiration')
                || resp.headers.get('github-authentication-token-expiration');
            if (header) {
                const expiry = new Date(header);
                if (!Number.isNaN(expiry.getTime()) && expiry.getTime() <= Date.now()) {
                    throw new Error(TOKEN_EXPIRED_MSG);
                }
            }
        }

        async function resolveAndVerifyToken() {
            const token = await resolveGitHubToken(document.getElementById('ghToken').value);
            await assertTokenUsable(token);
            showExpiredHint(false);
            return token;
        }

        // Load config from localStorage
        function loadConfig() {
            const savedToken = localStorage.getItem('gh_token') || '';
            const ownerInput = document.getElementById('ghOwner');
            const repoInput = document.getElementById('ghRepo');
            const branchInput = document.getElementById('ghBranch');
            document.getElementById('ghToken').value = savedToken;
            ownerInput.value = localStorage.getItem('gh_owner') || ownerInput.value || 'Ryan-AYuan';
            repoInput.value = localStorage.getItem('gh_repo') || repoInput.value || 'ryy';
            branchInput.value = localStorage.getItem('gh_branch') || branchInput.value || 'main';
            updateTokenHint();
            if (!savedToken) {
                document.getElementById('configSection').classList.remove('hidden');
            } else {
                checkSavedCredential();
            }
        }

        async function checkSavedCredential() {
            try {
                await resolveAndVerifyToken();
            } catch (e) {
                if (String(e.message) === TOKEN_EXPIRED_MSG) {
                    showExpiredHint(true);
                    document.getElementById('configSection').classList.remove('hidden');
                }
            }
        }

        function persistConfig(showAlert) {
            localStorage.setItem('gh_token', document.getElementById('ghToken').value.trim());
            localStorage.setItem('gh_owner', document.getElementById('ghOwner').value.trim() || 'Ryan-AYuan');
            localStorage.setItem('gh_repo', document.getElementById('ghRepo').value.trim() || 'ryy');
            localStorage.setItem('gh_branch', document.getElementById('ghBranch').value.trim() || 'main');
            updateTokenHint();
            if (showAlert) {
                alert('Settings saved! 這台裝置之後不用再填 Token。');
                document.getElementById('configSection').classList.add('hidden');
            }
        }

        function saveConfig() {
            persistConfig(true);
        }

        function updateTokenHint() {
            const hint = document.getElementById('tokenSavedHint');
            if (!hint) return;
            if (localStorage.getItem('gh_token')) {
                hint.classList.remove('hidden');
            } else {
                hint.classList.add('hidden');
            }
        }

        function toggleConfig() {
            document.getElementById('configSection').classList.toggle('hidden');
        }

        function toggleAlbumInputs() {
            const folder = document.getElementById('targetFolder').value;
            const albumInputs = document.getElementById('albumInputs');
            if (folder === 'photo') {
                albumInputs.classList.remove('hidden');
            } else {
                albumInputs.classList.add('hidden');
            }
            updatePickerHints();
        }

        function updatePickerHints() {
            const folder = document.getElementById('targetFolder').value;
            const input = document.getElementById('fileInput');
            const hint = document.getElementById('dropHint');
            const sub = document.getElementById('dropSub');
            if (folder === 'photo') {
                input.accept = 'image/*,.heic,.heif,image/heic,image/heif';
                hint.textContent = '點擊選擇照片';
                sub.textContent = '手機可從相簿選取或拍照；iPhone 的 HEIC 會自動轉成 JPG';
            } else if (folder === 'bgm') {
                input.accept = 'audio/mpeg,.mp3,audio/*';
                hint.textContent = '點擊選擇音樂';
                sub.textContent = '請選擇 MP3 檔';
            } else {
                input.accept = '.html,text/html';
                hint.textContent = '點擊選擇作品';
                sub.textContent = '請選擇 HTML 檔';
            }
        }

        function isHeicFile(file) {
            return /\.(heic|heif)$/i.test(file.name) || /image\/hei/i.test(file.type || '');
        }

        async function convertHeicToJpeg(file) {
            const bitmap = await createImageBitmap(file);
            const canvas = document.createElement('canvas');
            canvas.width = bitmap.width;
            canvas.height = bitmap.height;
            canvas.getContext('2d').drawImage(bitmap, 0, 0);
            bitmap.close && bitmap.close();
            const blob = await new Promise((resolve, reject) => {
                canvas.toBlob((result) => result ? resolve(result) : reject(new Error('JPEG 轉換失敗')), 'image/jpeg', 0.9);
            });
            const newName = /\.(heic|heif)$/i.test(file.name)
                ? file.name.replace(/\.(heic|heif)$/i, '.jpg')
                : `${file.name}.jpg`;
            return new File([blob], newName, { type: 'image/jpeg' });
        }

        async function prepareUploadFile(file, folder) {
            if (folder !== 'photo') return file;
            if (isHeicFile(file)) {
                try {
                    return await convertHeicToJpeg(file);
                } catch (e) {
                    throw new Error('iPhone HEIC 無法轉換，請在相簿改存成 JPG 後再上傳');
                }
            }
            if (!/\.(jpg|jpeg|png|gif|webp)$/i.test(file.name) && !(file.type || '').startsWith('image/')) {
                throw new Error('只支援 jpg / png / gif / webp 圖片');
            }
            return file;
        }

        function encodeGitHubPath(path) {
            return path.split('/').map(encodeURIComponent).join('/');
        }

        function updateFileList() {
            const input = document.getElementById('fileInput');
            const list = document.getElementById('fileList');
            if (input.files.length > 0) {
                list.innerHTML = `Selected ${input.files.length} file(s):<br>` + 
                    Array.from(input.files).map(f => `- ${f.name}`).join('<br>');
            } else {
                list.innerHTML = '';
            }
        }

        async function uploadFiles() {
            const owner = document.getElementById('ghOwner').value;
            const repo = document.getElementById('ghRepo').value;
            const branch = document.getElementById('ghBranch').value;
            const folder = document.getElementById('targetFolder').value;
            const files = document.getElementById('fileInput').files;
            const statusArea = document.getElementById('statusArea');
            const btn = document.getElementById('uploadBtn');

            let token;
            try {
                token = await resolveAndVerifyToken();
            } catch (e) {
                statusArea.className = 'status error';
                statusArea.textContent = e.message;
                statusArea.style.display = 'block';
                document.getElementById('configSection').classList.remove('hidden');
                if (String(e.message) === TOKEN_EXPIRED_MSG) showExpiredHint(true);
                return;
            }

            persistConfig(false);

            if (files.length === 0) {
                statusArea.className = 'status error';
                statusArea.textContent = 'Please select files to upload.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Checking files...';
            statusArea.style.display = 'none';

            let successCount = 0;
            let skippedCount = 0;
            let errors = [];

            // Determine effective target directory
            let targetDir = folder;
            if (folder === 'photo') {
                const album = document.getElementById('uploadAlbum').value;
                if (!album) {
                    statusArea.className = 'status error';
                    statusArea.textContent = 'Please select an album.';
                    btn.disabled = false;
                    btn.textContent = 'Start Upload';
                    return;
                }
                targetDir = `${folder}/${album}`;
            }

            const preparedFiles = [];
            for (const file of files) {
                try {
                    preparedFiles.push(await prepareUploadFile(file, folder));
                } catch (e) {
                    errors.push(`${file.name}: ${e.message}`);
                }
            }
            if (preparedFiles.length === 0) {
                btn.disabled = false;
                btn.textContent = 'Start Upload';
                statusArea.className = 'status error';
                statusArea.innerHTML = errors.length ? `Errors:<br>${errors.join('<br>')}` : '沒有可上傳的檔案。';
                statusArea.style.display = 'block';
                return;
            }

            // Fetch existing files in the target folder to check for duplicates
            const dirUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${encodeGitHubPath(targetDir)}?ref=${branch}`;
            let existingFiles = new Map(); // filename -> sha

            try {
                const dirResp = await fetch(dirUrl, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (dirResp.ok) {
                    const data = await dirResp.json();
                    if (Array.isArray(data)) {
                        data.forEach(item => existingFiles.set(item.name, item.sha));
                    }
                } else if (dirResp.status !== 404) {
                    console.warn("Could not list directory, status:", dirResp.status);
                }
            } catch (e) {
                console.warn("Error fetching directory listing:", e);
            }

            btn.textContent = 'Uploading...';

            // Batch check for duplicates
            let duplicates = [];
            for (let file of preparedFiles) {
                if (existingFiles.has(file.name)) {
                    duplicates.push(file.name);
                }
            }

            if (duplicates.length > 0) {
                const maxDisplay = 10;
                let fileListStr = duplicates.slice(0, maxDisplay).join('\n');
                if (duplicates.length > maxDisplay) {
                    fileListStr += `\n...and ${duplicates.length - maxDisplay} more`;
                }
                
                const msg = `以下文件已存在 (The following files already exist):\n\n${fileListStr}\n\n上傳重複文件將自動覆蓋原有內容 (Uploading duplicate files will automatically overwrite original content).\n是否繼續？ (Continue?)`;
                
                if (!confirm(msg)) {
                    btn.disabled = false;
                    btn.textContent = 'Start Upload';
                    statusArea.className = 'status';
                    statusArea.textContent = 'Upload cancelled.';
                    statusArea.style.display = 'block';
                    return;
                }
            }
 
            for (let file of preparedFiles) {
                try {
                    let sha = null;
                    
                    if (existingFiles.has(file.name)) {
                        sha = existingFiles.get(file.name);
                    }
 
                    const content = await readFileAsBase64(file);
                    let targetPath = encodeGitHubPath(`${targetDir}/${file.name}`);
                    
                    // Upload
                    const uploadUrl = `https://api.github.com/repos/${owner}/${repo}/contents/${targetPath}`;
                    const body = {
                        message: `Upload ${file.name} via Web Interface`,
                        content: content,
                        branch: branch
                    };
                    if (sha) body.sha = sha;

                    const putResp = await fetch(uploadUrl, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(body)
                    });

                    if (putResp.status === 401 || putResp.status === 403) {
                        throw new Error(TOKEN_EXPIRED_MSG);
                    }
                    if (!putResp.ok) {
                        throw new Error(`Failed to upload ${file.name}: ${putResp.statusText}`);
                    }
                    successCount++;

                } catch (e) {
                    console.error(e);
                    errors.push(`${file.name}: ${e.message}`);
                }
            }

            btn.disabled = false;
            btn.textContent = 'Start Upload';

            let msg = [];
            if (successCount > 0) msg.push(`Successfully uploaded ${successCount} files.`);
            if (skippedCount > 0) msg.push(`Skipped ${skippedCount} files.`);
            
            if (errors.length > 0) {
                statusArea.className = 'status error';
                msg.push(`Errors:<br>${errors.join('<br>')}`);
                statusArea.innerHTML = msg.join('<br>');
            } else {
                statusArea.className = 'status success';
                statusArea.innerHTML = msg.join('<br>');
            }
            if (msg.length > 0) statusArea.style.display = 'block';
        }

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    // Remove "data:*/*;base64," prefix
                    const content = reader.result.split(',')[1];
                    resolve(content);
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        // Initialize
        loadConfig();
        toggleAlbumInputs();
        document.getElementById('ghToken').addEventListener('change', () => persistConfig(false));
        document.getElementById('ghOwner').addEventListener('change', () => persistConfig(false));
        document.getElementById('ghRepo').addEventListener('change', () => persistConfig(false));
        document.getElementById('ghBranch').addEventListener('change', () => persistConfig(false));

        (function setupDragDrop() {
            const zone = document.querySelector('.file-drop-zone');
            const input = document.getElementById('fileInput');
            if (!zone || !input) return;
            zone.addEventListener('dragover', (e) => {
                e.preventDefault();
            });
            zone.addEventListener('drop', (e) => {
                e.preventDefault();
                if (e.dataTransfer && e.dataTransfer.files.length) {
                    input.files = e.dataTransfer.files;
                    updateFileList();
                }
            });
        })();
    </script>
</body>
</html>
